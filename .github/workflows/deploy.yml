name: deploy
on:
  push:
    branches:
      - main
  # The package tables live only in the deployed site, not in git; the schedule
  # is what keeps them fresh.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# ghp-import force-pushes gh-pages; two runs racing each other could publish
# the older build last.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch can be pointed at any branch; only main may deploy.
    if: github.ref == 'refs/heads/main'
    # `ghp-import --push` pushes the built site to the gh-pages branch
    permissions:
      contents: write
    steps:
      # ghp-import pushes with the credentials persisted by checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      # Regenerates every distro with a dataChannel in src/data/distros.json;
      # a distro without one (foxy, galactic) is a committed snapshot. A failed
      # distro does not stop the deploy: the ensure-tables task inside
      # build-docs falls back to the currently deployed copy for whatever is
      # missing, and the run is marked failed at the end.
      - name: Update tables
        id: update
        continue-on-error: true
        run: pixi run update-tables
      # The awstats reports behind the download counts are one ~20 MB file per
      # complete month and never change once published, so the cache only ever
      # grows by one file a month. Keying on the month makes each key hit until
      # the month rolls over, when restore-keys carries the old files forward
      # and the run fetches just the newest report.
      - name: Compute cache month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore awstats cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ros-awstats-cache
          key: ros-awstats-${{ steps.month.outputs.month }}
          restore-keys: ros-awstats-
      # Same failure policy as the tables: a broken awstats fetch must not stop
      # the deploy. The page treats a missing downloads file as "feature off",
      # and ensure-tables inside build-docs falls back to the deployed copy.
      - name: Update download counts
        id: downloads
        continue-on-error: true
        run: pixi run update-downloads --cache-dir ~/ros-awstats-cache --prune-cache
      - run: pixi run gh-deploy
      - name: Surface update failures
        if: steps.update.outcome == 'failure' || steps.downloads.outcome == 'failure'
        run: exit 1
